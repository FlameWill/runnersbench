name: Benchmark

on:
  workflow_dispatch:
    inputs:
      providers:
        description: Comma-separated providers to run, e.g. "github,depot". Leave blank for every enabled runner.
        required: false
        default: ""
      repetitions:
        description: Number of times to run each runner
        required: false
        default: "1"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      github: ${{ steps.matrix.outputs.github }}
      buildkite: ${{ steps.matrix.outputs.buildkite }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          PROVIDERS: ${{ inputs.providers }}
          REPETITIONS: ${{ inputs.repetitions || '1' }}
        run: |
          matrix=$(jq -c --arg providers "$PROVIDERS" --argjson reps "$REPETITIONS" '
            ($providers | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))) as $wanted
            | {include: [
                .runners[]
                | select(.enabled)
                | select(($wanted | length) == 0 or (.provider | IN($wanted[])))
                | . as $runner
                | range(1; $reps + 1)
                | $runner + {rep: .}
              ]}' providers.json)
          if [ "$(jq '.include | length' <<<"$matrix")" -eq 0 ]; then
            echo "::error::No enabled runners match providers='$PROVIDERS'"
            exit 1
          fi
          jq . <<<"$matrix"
          echo "github=$(jq -c '{include: [.include[] | select(has("buildkite") | not)]}' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          echo "buildkite=$(jq -c '{include: [.include[] | select(has("buildkite"))]}' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  bench:
    needs: setup
    if: ${{ fromJSON(needs.setup.outputs.github).include[0] }}
    # analyze.py matches this name against the GitHub API to get queue times.
    name: ${{ matrix.label }} (${{ matrix.rep }})
    runs-on: ${{ matrix.label }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.github) }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Benchmark
        env:
          RUNNER_SPEC: ${{ toJSON(matrix) }}
        run: python bench/run.py --output "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.label }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error

  bench-buildkite:
    needs: setup
    if: ${{ fromJSON(needs.setup.outputs.buildkite).include[0] }}
    name: ${{ matrix.label }} (${{ matrix.rep }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.buildkite) }}
    steps:
      - uses: actions/checkout@v7
      - name: Benchmark on Buildkite
        env:
          RUNNER_SPEC: ${{ toJSON(matrix) }}
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
        run: python3 bench/buildkite.py --output "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.label }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error

  analyze:
    needs: [bench, bench-buildkite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
      - name: Analyze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python analyze/analyze.py --job-timing --json combined/results.json --summary combined/data.json \
            --markdown combined/report.md results
          cat combined/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: combined-results
          path: combined/
          retention-days: 90
      # Only full runs replace the site, so a partial run started for testing doesn't hide other providers.
      - uses: actions/checkout@v7
        if: ${{ github.ref == 'refs/heads/main' && !inputs.providers }}
        with:
          ref: gh-pages
          path: pages
      - name: Publish to GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && !inputs.providers }}
        run: |
          find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r site/. combined/. pages/
          # GitHub Pages lets browsers cache assets for 10 minutes; a new URL per publish skips that.
          sed -i -E "s/(style\.css|app\.js)\"/\1?v=${GITHUB_RUN_ID}\"/" pages/index.html
          touch pages/.nojekyll
          cd pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish results from run ${GITHUB_RUN_ID}"
          git push -q
          echo "Published to https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
