name: Benchmark

on:
  workflow_dispatch:
    inputs:
      providers:
        description: Comma-separated providers to run, e.g. "github,depot". Leave blank for every enabled runner.
        required: false
        default: ""
      repetitions:
        description: Number of times to run each runner
        required: false
        default: "1"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          PROVIDERS: ${{ inputs.providers }}
          REPETITIONS: ${{ inputs.repetitions || '1' }}
        run: |
          matrix=$(jq -c --arg providers "$PROVIDERS" --argjson reps "$REPETITIONS" '
            ($providers | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))) as $wanted
            | {include: [
                .runners[]
                | select(.enabled)
                | select(($wanted | length) == 0 or (.provider | IN($wanted[])))
                | . as $runner
                | range(1; $reps + 1)
                | $runner + {rep: .}
              ]}' providers.json)
          if [ "$(jq '.include | length' <<<"$matrix")" -eq 0 ]; then
            echo "::error::No enabled runners match providers='$PROVIDERS'"
            exit 1
          fi
          jq . <<<"$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  bench:
    needs: setup
    # analyze.py matches this name against the GitHub API to get queue times.
    name: ${{ matrix.label }} (${{ matrix.rep }})
    runs-on: ${{ matrix.label }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Benchmark
        env:
          RUNNER_SPEC: ${{ toJSON(matrix) }}
        run: python bench/run.py --output "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.label }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error

  analyze:
    needs: bench
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
      - name: Analyze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python analyze/analyze.py --job-timing --json combined/results.json --markdown combined/report.md results
          cat combined/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: combined-results
          path: combined/
          retention-days: 90
