<!-- Source for site/og.png (1200x630). Render it with a headless browser at that size and save over site/og.png. -->
<!doctype html>
<html><head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; background: #2b3445; color: #fefefe; font-family: "Funnel Display", sans-serif; position: relative; overflow: hidden; }
.inner { padding: 64px 80px; }
.brand { font: 500 34px "Funnel Display"; }
.brand span { color: #b8bfcb; }
h1 { font: 500 96px/1.02 "Funnel Display"; letter-spacing: -0.02em; margin-top: 72px; }
p { font: 26px "IBM Plex Mono", monospace; color: #d9dde4; margin-top: 28px; }
.bars { display: flex; gap: 10px; margin-top: 44px; align-items: flex-end; height: 70px; }
.bars i { display: block; width: 46px; }
.url { position: absolute; right: 80px; top: 72px; font: 24px "IBM Plex Mono", monospace; color: #b8bfcb; }
.horizon { position: absolute; left: 0; right: 0; bottom: 0; height: 84px;
  background: linear-gradient(#2b3445 0 14%, #677286 14% 30%, #8e98a8 30% 46%, #b8bfcb 46% 60%, #d9dde4 60% 74%, #eceef2 74% 87%, #fefefe 87%); }
</style></head>
<body><div class="inner">
<div class="brand">runners<span>/bench</span></div>
<div class="url">runnersbench.com</div>
<h1>CI runner benchmarks</h1>
<p>GitHub Actions runner providers, side by side.</p>
<div class="bars">
<i style="height:100%;background:#4269d0"></i><i style="height:86%;background:#efb118"></i><i style="height:78%;background:#ff725c"></i><i style="height:64%;background:#6cc5b0"></i><i style="height:52%;background:#3ca951"></i><i style="height:40%;background:#ff8ab7"></i><i style="height:30%;background:#a463f2"></i><i style="height:20%;background:#97bbf5"></i>
</div>
</div><div class="horizon"></div></body></html>
